<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portföy Uygulaması Mockup Önizleme</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #1ED760;
    }
    p {
      color: #a7a7a7;
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .mockup-container {
      border: 2px solid #282828;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      max-width: 420px;
      width: 100%;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Portföyüm — Spotify Dark Style Mockup</h1>
  <p>TR / ABD / Altın Konsolide Portföy Tasarımı</p>
  <div class="mockup-container">
    <img src="mockup.jpg" alt="Portfolio UI Mockup">
  </div>
</body>
</html>
