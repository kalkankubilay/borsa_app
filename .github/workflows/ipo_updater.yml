name: Güncel Halka Arzları Otomatik Güncelle

on:
  schedule:
    # Her gün saat 18:30 (UTC 15:30) ve Perşembe akşamı SPK bülteni sonrası
    - cron: '30 15 * * *'
    - cron: '0 21 * * 4'
  workflow_dispatch: # Manuel çalıştırmaya da imkan verir

jobs:
  update-ipos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          pip install beautifulsoup4

      - name: Halka Arzları Güncelle
        run: |
          python scripts/update_ipos.py

      - name: Değişiklikleri Kaydet ve Pushla
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/halka_arzlar.json
          if git diff --staged --quiet; then
            echo "Yeni halka arz değişikliği yok."
          else
            git commit -m "chore: halka arz takvimi otomatik güncellendi [skip ci]"
            git push
          fi
